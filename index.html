<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>静雯的迷宫</title>
  <style>
    :root {
      --dark-gray: #878787;
      --light-gray: #d0d0d0;
      --line-gray: #999;
      --text: #111;
      --wrong: #ff6969;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: "Meta Corr Pro", Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    body {
      min-width: 1024px;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      display: none;
      width: 100vw;
      min-height: 100vh;
    }

    .screen.active {
      display: block;
    }

    .home {
      position: relative;
      height: 100vh;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .home.active {
      display: flex;
    }

    .home-stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      overflow: hidden;
      background: #fff url("assets/maze.png") center / 100% 100% no-repeat;
      container-type: size;
    }

    .home-card {
      position: absolute;
      inset: 0;
      border: 0;
      background: transparent;
      text-align: center;
    }

    .home-title {
      position: absolute;
      left: 0;
      top: 37.6%;
      width: 100%;
      margin: 0;
      font-size: 2.083cqw;
      font-weight: 400;
      line-height: 1.2;
    }

    .home-subtitle {
      position: absolute;
      left: 0;
      top: 44.85%;
      width: 100%;
      margin: 0;
      font-size: 1.042cqw;
      line-height: 1.2;
    }

    .btn {
      height: 49px;
      border: 0;
      background: var(--dark-gray);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .btn:hover {
      background: #767676;
    }

    .btn-light {
      background: var(--light-gray);
      color: #666;
    }

    .btn-light:hover {
      background: #bdbdbd;
    }

    .btn-start {
      position: absolute;
      left: 50%;
      top: 53.89%;
      width: 6.771%;
      height: 4.537%;
      transform: translateX(-50%);
      font-size: 0.938cqw;
    }

    .quiz,
    .gallery,
    .photos {
      min-height: 100vh;
      padding-top: 1px;
      background: #fff;
    }

    .quiz-panel {
      width: 542px;
      margin: 260px auto 0;
    }

    .question {
      margin: 0 0 27px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.15;
    }

    .captcha-img {
      display: block;
      width: 542px;
      height: 181px;
      object-fit: cover;
    }

    .count {
      margin-top: 11px;
      font-size: 20px;
      line-height: 1;
    }

    .answer {
      display: block;
      width: 542px;
      height: 90px;
      margin-top: 81px;
      padding: 0 29px;
      border: 1px solid var(--line-gray);
      outline: none;
      color: #111;
      font-size: 18px;
    }

    .answer::placeholder {
      color: #878787;
      opacity: 1;
    }

    .answer.wrong::placeholder {
      color: var(--wrong);
      opacity: 1;
    }

    .button-row {
      display: flex;
      gap: 27px;
      margin-top: 31px;
    }

    .quiz .btn {
      width: 257px;
    }

    .gallery-panel {
      width: 1482px;
      margin: 181px auto 0;
    }

    .gallery-title {
      margin: 0 0 39px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.1;
    }

    .captcha-grid {
      display: grid;
      grid-template-columns: repeat(4, 306px);
      column-gap: 87px;
      row-gap: 25px;
    }

    .thumb {
      width: 306px;
      height: 102px;
      object-fit: cover;
      display: block;
    }

    .gallery .button-row {
      width: 658px;
      margin: 88px auto 0;
    }

    .gallery .btn-light {
      width: 258px;
    }

    .gallery .btn-main {
      width: 374px;
    }

    .photos-panel {
      width: 1160px;
      margin: 287px auto 0;
    }

    .error-title {
      margin: 0 0 45px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
    }

    .photo-row {
      display: flex;
      align-items: flex-start;
      gap: 48px;
    }

    .photo {
      display: block;
      object-fit: cover;
    }

    .photo-1 {
      width: 490px;
      height: 277px;
    }

    .photo-2 {
      width: 368px;
      height: 277px;
    }

    .photo-3 {
      width: 208px;
      height: 277px;
    }

    .btn-fine {
      display: block;
      width: 374px;
      margin: 78px auto 0;
    }

    @media (max-width: 1200px) {
      body {
        min-width: 0;
      }

      .gallery-panel,
      .photos-panel {
        transform: scale(0.72);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="home" class="screen home active" aria-label="Home">
      <div class="home-stage">
        <div class="home-card">
          <h1 class="home-title">Welcome to Jingwen's Labyrinth.</h1>
          <p class="home-subtitle">Solve all the puzzles and see who is inside.</p>
          <button id="startBtn" class="btn btn-start" type="button">Start.</button>
        </div>
      </div>
    </section>

    <section id="quiz" class="screen quiz" aria-label="Puzzle">
      <div class="quiz-panel">
        <p id="question" class="question"></p>
        <img id="captcha" class="captcha-img" alt="" />
        <div id="count" class="count"></div>
        <input id="answer" class="answer" autocomplete="off" spellcheck="false" placeholder="Please enter here." />
        <div class="button-row">
          <button id="quitQuiz" class="btn btn-light" type="button">I quit.</button>
          <button id="submitAnswer" class="btn" type="button">That is it.</button>
        </div>
      </div>
    </section>

    <section id="gallery" class="screen gallery" aria-label="Solved puzzles">
      <div class="gallery-panel">
        <h2 class="gallery-title">Congratulations! You've solved all the puzzles!</h2>
        <div id="captchaGrid" class="captcha-grid"></div>
        <div class="button-row">
          <button id="quitGallery" class="btn btn-light" type="button">I quit.</button>
          <button id="behindBtn" class="btn btn-main" type="button">Let’s see what is behind!</button>
        </div>
      </div>
    </section>

    <section id="photos" class="screen photos" aria-label="Photos">
      <div class="photos-panel">
        <h2 class="error-title">ERROR: Website under construction, these are this month's photos</h2>
        <div class="photo-row">
          <img class="photo photo-1" src="assets/photos/photo-1.png" alt="" />
          <img class="photo photo-2" src="assets/photos/photo-2.jpg" alt="" />
          <img class="photo photo-3" src="assets/photos/photo-3.png" alt="" />
        </div>
        <button id="fineBtn" class="btn btn-fine" type="button">Fine......</button>
      </div>
    </section>
  </main>

  <script>
    const base = 'assets/captchas/';
    const puzzles = [
      ['This is her Chinese name:', '徐静雯'],
      ['This is her English name:', 'ReBECCA'],
      ['This is her English Chinese name:', 'xujingwen'],
      ['This is her online nickname:', 'yundouzi'],
      ['This is the postal code of her hometown:', '432800'],
      ['This is the postal code of where she is now:', '518000'],
      ['This her Chinese zodiac sign:', 'MONkey'],
      ['This is what she is studying:', 'design'],
      ['This is her first special hobby:', 'PLANT'],
      ['This is her second special hobby:', 'writing'],
      ['This is her favorite singer:', 'TAYLORS'],
      ['She has no magic.', 'MUGGLE'],
      ['This is a book she loves:', 'mybrilliantfriend'],
      ['This is her total WeRead reading time:', '6840'],
      ['This is what she is looking for:', 'happiness'],
      ['This is the date this website was created.', '0611']
    ].map((item, index) => ({
      question: item[0],
      answer: item[1],
      image: `${base}${index + 1}.png`
    }));

    const screens = {
      home: document.getElementById('home'),
      quiz: document.getElementById('quiz'),
      gallery: document.getElementById('gallery'),
      photos: document.getElementById('photos')
    };

    const question = document.getElementById('question');
    const captcha = document.getElementById('captcha');
    const count = document.getElementById('count');
    const answer = document.getElementById('answer');
    const grid = document.getElementById('captchaGrid');
    let current = 0;

    function show(name) {
      Object.values(screens).forEach((screen) => screen.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function renderPuzzle() {
      const puzzle = puzzles[current];
      question.textContent = puzzle.question;
      captcha.src = puzzle.image;
      count.textContent = `(${current + 1}/16)`;
      answer.value = '';
      answer.placeholder = 'Please enter here.';
      answer.classList.remove('wrong');
      show('quiz');
      answer.focus();
    }

    function quit() {
      current = 0;
      show('home');
    }

    function submit() {
      const puzzle = puzzles[current];
      if (answer.value === puzzle.answer) {
        current += 1;
        if (current >= puzzles.length) {
          renderGallery();
          return;
        }
        renderPuzzle();
        return;
      }
      answer.value = '';
      answer.placeholder = 'Wrong！Please enter again.';
      answer.classList.add('wrong');
    }

    function renderGallery() {
      grid.innerHTML = '';
      puzzles.forEach((puzzle) => {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = puzzle.image;
        img.alt = '';
        grid.appendChild(img);
      });
      show('gallery');
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      current = 0;
      renderPuzzle();
    });

    document.getElementById('quitQuiz').addEventListener('click', quit);
    document.getElementById('quitGallery').addEventListener('click', quit);
    document.getElementById('submitAnswer').addEventListener('click', submit);
    document.getElementById('behindBtn').addEventListener('click', () => show('photos'));
    document.getElementById('fineBtn').addEventListener('click', quit);
    answer.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        submit();
      }
    });
    answer.addEventListener('input', () => {
      if (answer.classList.contains('wrong')) {
        answer.classList.remove('wrong');
        answer.placeholder = 'Please enter here.';
      }
    });
  </script>
</body>
</html>
